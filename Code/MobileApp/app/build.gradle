plugins {
    id "com.android.application"
}

def heritageApiUrl = providers.gradleProperty("heritageApiUrl")
        .getOrElse("https://api.smart-heritage.local")
def debugApiUrl = providers.gradleProperty("heritageApiUrl")
        .getOrElse("http://10.0.2.2:8080")

android {
    namespace "com.smartheritage.visitor"
    compileSdk 35

    defaultConfig {
        applicationId "com.smartheritage.visitor"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "API_BASE_URL", "\"${heritageApiUrl}\""
    }

    buildTypes {
        debug {
            buildConfigField "String", "API_BASE_URL", "\"${debugApiUrl}\""
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
